name: DSH REA bundle
on:
  pull_request:
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh-rea-bundle.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh-rea-bundle.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify manifest and compatibility contract
        run: npm --prefix integrations/deepseek-harness test
      - name: Check package file list
        run: npm --prefix integrations/deepseek-harness run pack:check
      - name: Assemble installable bundle
        run: npm pack ./integrations/deepseek-harness --pack-destination .
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: dsh-rea-bundle
          path: dsh-rea-bundle-0.3.0.tgz
          if-no-files-found: error
